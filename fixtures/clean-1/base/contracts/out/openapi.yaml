security:
  - BearerAuth: []
components:
  parameters:
    AuditReasonHeader:
      name: X-Audit-Log-Reason
      in: header
      required: false
      schema:
        type: string
  schemas:
    AckRequest:
      type: object
      properties:
        manual:
          type: boolean
          description: '`true` → "okunmadı işaretle" (son okunanı geriye alabilir). Varsayılan: yalnız ileri gider.'
      description: Okundu işareti.
    ActiveSession:
      type: object
      required:
        - id
        - family_id
        - user_agent
        - ip_prefix
        - created_at
        - last_used_at
        - current
        - grace_sibling
      properties:
        id:
          $ref: '#/components/schemas/Snowflake'
        family_id:
          $ref: '#/components/schemas/Snowflake'
          description: Refresh ailesi (ilk girişin oturum kimliği). Aynı ailedeki satırlar aynı cihazdır.
        user_agent:
          type: string
          description: Ham User-Agent (≤300); cihaz/tarayıcı özetini istemci çıkarır.
        ip_prefix:
          type: string
          description: "IP'nin kısaltılmış hâli: IPv4 /24 (`203.0.113.x`), IPv6 /48 (`2001:db8:1::/48`). Tam IP API'de gösterilmez."
        created_at:
          type: string
          format: date-time
          description: Ailenin ilk girişi.
        last_used_at:
          type: string
          format: date-time
          description: Son token yenileme (erişim token'ı ömrü kadar, ≤15 dk, gecikmeli).
        current:
          type: boolean
          description: İsteği yapan oturum (bu cihaz).
        grace_sibling:
          type: boolean
          description: Refresh hoşgörü penceresiyle açılmış kardeş oturum (K42; aynı cihazın paralel sekmesi).
      description: Aktif oturum (EKRANLAR 7.4). Bir satır = bir refresh ailesinin canlı halkası. Kapatma tüm aileyi (hoşgörü kardeşleri dahil) iptal eder.
    AllowedMentionType:
      type: string
      enum:
        - roles
        - users
        - everyone
    AllowedMentions:
      type: object
      properties:
        parse:
          type: array
          items:
            $ref: '#/components/schemas/AllowedMentionType'
        replied_user:
          type: boolean
          description: Yanıtta yanıtlanan kişiye bildirim gitsin mi (5.2 "
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Yalnız 422'de dolu.
        retry_after:
          type: number
          format: double
          description: "Yalnız 429'da: kaç saniye sonra yeniden denenmeli."
        suspended_until:
          type: string
          format: date-time
          description: "Yalnız ACCOUNT_SUSPENDED'da: askının bitişi (süresizse yok)."
      description: |-
        Tüm hata yanıtlarının tek biçimi (OpenAPI `default` yanıtı). İç ayrıntı (SQL, yığın izi,
        dosya yolu) asla içermez. HTTP durumu `code`'la tutarlıdır (bkz. servis açıklaması);
        henüz yazılmamış uç 501 NOT_IMPLEMENTED döner.
    Attachment:
      type: object
      required:
        - id
        - filename
        - content_type
        - size
        - url
        - url_expires_at
        - width
        - height
        - status
      properties:
        id:
          $ref: '#/components/schemas/Snowflake'
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
          description: Bayt.
        url:
          anyOf:
            - type: string
              format: uri
            - type: 'null'
          description: İmzalı indirme adresi (kısa ömürlü). Süresi geçince `GET /v1/attachments/{id}/url`.
        url_expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        width:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        height:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        status:
          $ref: '#/components/schemas/AttachmentStatus'
    AttachmentPurpose:
      type: string
      enum:
        - message
        - avatar
        - banner
        - guild_icon
    AttachmentStatus:
      type: string
      enum:
        - pending
        - ready
        - blocked
    AuditLogAction:
      type: integer
      enum:
        - 1
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 20
        - 22
        - 23
        - 24
        - 25
        - 26
        - 27
        - 30
        - 31
        - 32
        - 40
        - 42
        - 72
        - 73
      description: Discord v10 denetim kaydı eylem kodları (Beta 0 alt kümesi). Sahiplik devri = GUILD_UPDATE (`owner_id` değişimi).
      x-enum-varnames:
        - GUILD_UPDATE
        - CHANNEL_CREATE
        - CHANNEL_UPDATE
        - CHANNEL_DELETE
        - CHANNEL_OVERWRITE_CREATE
        - CHANNEL_OVERWRITE_UPDATE
        - CHANNEL_OVERWRITE_DELETE
        - MEMBER_KICK
        - MEMBER_BAN_ADD
        - MEMBER_BAN_REMOVE
        - MEMBER_UPDATE
        - MEMBER_ROLE_UPDATE
        - MEMBER_MOVE
        - MEMBER_DISCONNECT
        - ROLE_CREATE
        - ROLE_UPDATE
        - ROLE_DELETE
        - INVITE_CREATE
        - INVITE_DELETE
        - MESSAGE_DELETE
        - MESSAGE_BULK_DELETE
    AuditLogChange:
      type: object
      required:
        - key
      properties:
        key:
          type: string
        old_value: {}
        new_value: {}
      description: Değişen tek alan (önce → sonra). Değerler JSON'daki biçimiyle.
    AuditLogEntry:
      type: object
      required:
        - id
        - user_id
        - action_type
        - target_id
        - changes
        - reason
      properties:
        id:
          $ref: '#/components/schemas/Snowflake'
        user_id:
          anyOf:
            - $ref: '#/components/schemas/Snowflake'
            - type: 'null'
          description: Eylemi yapan; sistem eyleminde null.
        action_type:
          $ref: '#/components/schemas/AuditLogAction'
        target_id:
          anyOf:
            - type: string
            - type: 'null'
          description: Etkilenen varlık (kanal, rol, üye, davet kodu ...).
        changes:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogChange'
        reason:
          anyOf:
            - type: string
            - type: 'null'
        options:
          type: object
          additionalProperties:
            type: string
          description: Eyleme göre ek bilgi (ör. MESSAGE_DELETE → channel_id, count; MEMBER_MOVE → channel_id).
    AuditLogPage:
      type: object
      required:
        - audit_log_entries
        - users
      properties:
        audit_log_entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
          description: Yeniden eskiye.
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: Kayıtlarda geçen kullanıcılar (yapan + hedef).
    AuthSession:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: Opak değil, imzalı kısa ömürlü token; istemci içini okumaz.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          format: int32
          description: Saniye (varsayılan 900).
        user:
          $ref: '#/components/schemas/CurrentUser'
      description: |-
        Oturum yanıtı. Refresh token gövdede DEĞİL, `Set-Cookie` başlığındadır:
        `chatapp_rt=<token>; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth` (geliştirmede `Secure` yok).
    Ban:
      type: object
      required:
        - user
        - reason
      properties:
        user:
          $ref: '#/components/schemas/User'
        reason:
          anyOf:
            - type: string
            - type: 'null'
    BetaCodeCheck:
      type: object
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/BetaCodeState'
    BetaCodeCheckRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    BetaCodeState:
      type: string
      enum:
        - valid
        - invalid
        - expired
        - exhausted
    Channel:
      type: object
      required:
        - id
        - guild_id
        - type
        - name
        - topic
        - position
        - parent_id
        - permission_overwrites
        - bitrate
        - user_limit
        - last_message_id
      properties:
        id:
          $ref: '#/components/schemas/Snowflake'
        guild_id:
          $ref: '#/components/schemas/Snowflake'
        type:
          $ref: '#/components/schemas/ChannelType'
        name:
          type: string
          description: Metin kanalında küçük harf-tire biçimine normalleştirilir; 1–100.
        topic:
          anyOf:
            - type: string
            - type: 'null'
          description: Yalnız metin kanalı (≤1024).
        position:
          type: integer
          format: int32
          description: Aynı ebeveyn altındaki sıra (küçük önce).
        parent_id:
          anyOf:
            - $ref: '#/components/schemas/Snowflake'
            - type: 'null'
          description: Kategori kimliği; kategori ve kökteki kanallarda null.
        permission_overwrites:
          type: array
          items:
            $ref: '#/components/schemas/PermissionOverwrite'
        bitrate:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 'Yalnız ses: bit/sn (8000–384000).'
        user_limit:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 'Yalnız ses: 0 = sınırsız, 1–99.'
        last_message_id:
          anyOf:
            - $ref: '#/components/schemas/Snowflake'
            - type: 'null'
          description: Son mesajın kimliği (okunmamış hesabı için). Metin ve ses (oda sohbeti) kanallarında.
    ChannelCreateDispatch:
      type: object
      required:
        - op
        - s
        - t
        - d
      properties:
        op:
          type: integer
          enum:
            - 0
        s:
          type: integer
          format: int32
        t:
          type: string
          enum:
            - CHANNEL_CREATE
        d:
          $ref: '#/components/schemas/Channel'
      description: 'Dispatch çerçevesi şablonu: `s` artan sıra numarası (oturum başına).'
    ChannelDeleteDispatch:
      type: object
      required:
        - op
        - s
        - t
        - d
      properties:
        op:
          type: integer
          enum:
            - 0
        s:
          type: integer
          format: int32
        t:
          type: string
          enum:
            - CHANNEL_DELETE
        d:
          $ref: '#/components/schemas/Channel'
      description: 'Dispatch çerçevesi şablonu: `s` artan sıra numarası (oturum başına).'
    ChannelPosition:
      type: object
      required:
        - id
        - position
      properties:
        id:
          $ref: '#/components/schemas/Snowflake'
        position:
          type: integer
          format: int32
        parent_id:
          anyOf:
            - $ref: '#/components/schemas/Snowflake'
            - type: 'null'
          description: Verilirse kanal bu kategoriye taşınır (null = köke).
        lock_permissions:
          type: boolean
          description: Taşınırken yeni kategorinin izinlerini al.
    ChannelType:
      type: integer
      enum:
        - 0
        - 2
        - 4
      description: Discord sayısal kanal türleri (K25). Beta 0'da yalnız bu üçü.
      x-enum-varnames:
        - GUILD_TEXT
        - GUILD_VOICE
        - GUILD_CATEGORY
    ChannelUpdateDispatch:
      type: object
      required:
        - op
        - s
        - t
        - d
      properties:
        op:
          type: integer
          enum:
