openapi: 3.1.0
info:
  title: ChatApp API
  version: 1.0.0
  description: |-
    ChatApp REST API v1.

    - Kimlikler Snowflake (epoch 2015-01-01, K29), JSON'da **string**.
    - İzin bit dizileri Discord v10 değerleriyle, 64-bit tamsayının ondalık **string** gösterimi.
    - Kimlik doğrulama: `Authorization: Bearer <access_token>`. Access token login/register/refresh
    yanıtının gövdesinde gelir (ömür `expires_in` sn). Refresh token yalnız `chatapp_rt`
    HttpOnly çerezinde taşınır (Path=/v1/auth, SameSite=Strict).
    - Hata gövdesi her zaman `ApiError`. Durumlar: 400 bozuk istek · 401 kimlik yok/geçersiz ·
    403 izin yok · 404 yok ya da görme izni yok · 409 çakışma · 422 alan doğrulama ·
    429 hız sınırı (`retry_after`) · 5xx yalnız sunucu hatası.
    - Hoşgörülü okuyucu: istemciler bilinmeyen alanları yok sayar; v1'e yeni alan eklenebilir.
    - Gateway (WebSocket) ayrı adreste: `GET /v1/gateway` ile bulunur; çerçeve modelleri
    `Gateway*` şemalarıdır (components'te).
tags:
  - name: auth
  - name: users
  - name: guilds
  - name: channels
  - name: roles
  - name: members
  - name: bans
  - name: invites
  - name: messages
  - name: attachments
  - name: voice
  - name: internal
  - name: audit-log
  - name: system
paths:
  /health:
    get:
      operationId: System_health
      description: Süreç ayakta mı (bağımlılık denetlemez). api ve gateway rolünde aynı.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
      tags:
        - system
      security:
        - {}
  /ready:
    get:
      operationId: System_ready
      description: 'Trafik almaya hazır mı: PG + NATS + Valkey ping. Biri başarısızsa 503.'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
      tags:
        - system
      security:
        - {}
  /v1/attachments:
    post:
      operationId: Attachments_createUpload
      description: İmzalı yükleme adresi (W-01). SeaweedFS S3, ömür 15 dk.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - attachments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
  /v1/attachments/{attachment_id}/complete:
    post:
      operationId: Attachments_complete
      description: Nesne depoda var mı ve boyut tutuyor mu denetlenir → `ready`. Eksikse 409 UPLOAD_INCOMPLETE.
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - attachments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
  /v1/attachments/{attachment_id}/url:
    get:
      operationId: Attachments_downloadUrl
      description: Mesaj eki için taze imzalı indirme adresi (kanalı görme izni gerekir).
      parameters:
        - name: attachment_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrl'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - attachments
  /v1/auth/beta-codes/check:
    post:
      operationId: Auth_checkBetaCode
      description: 'Kayıt adım 1: beta kodu geçerli mi (kullanım sayacını artırmaz).'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetaCodeCheck'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetaCodeCheckRequest'
      security:
        - {}
  /v1/auth/email/resend:
    post:
      operationId: Auth_resendVerification
      description: Doğrulama e-postasını yeniden gönderir (1.4; 60 sn bekleme → 429 `retry_after`). Zaten doğrulanmışsa bir şey yapmaz.
      parameters: []
      responses:
        '204':
          description: 204 yanıtı.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
  /v1/auth/email/verify:
    post:
      operationId: Auth_verifyEmail
      description: 'E-posta doğrulama (1.4). Bağlantı tek kullanımlık ve süreli; sorunlu bağlantı → 422 VALIDATION_FAILED, `errors[field=token].code`: LINK_INVALID (geçersiz) / LINK_EXPIRED (süresi geçmiş) / LINK_USED (kullanılmış ya da yerine yenisi gönderilmiş). Kimlik gerekmez (bağlantı başka tarayıcıda açılabilir).'
      parameters: []
      responses:
        '204':
          description: 204 yanıtı.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      security:
        - {}
  /v1/auth/login:
    post:
      operationId: Auth_login
      description: Giriş (1.1). Yanlış bilgi → 401 INVALID_CREDENTIALS (hangisi olduğu söylenmez); askı → 403 ACCOUNT_SUSPENDED.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security:
        - {}
  /v1/auth/logout:
    post:
      operationId: Auth_logout
      description: Bu oturumu kapatır, çerezi siler. Gateway bağlantısı INVALID_SESSION alır.
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
  /v1/auth/password/forgot:
    post:
      operationId: Auth_forgotPassword
      description: Parolamı unuttum (1.5 adım 1). Hesap olsun olmasın her zaman 202 (hesap varlığı sızdırılmaz). IP başına hız sınırlı.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      security:
        - {}
  /v1/auth/password/reset:
    post:
      operationId: Auth_resetPassword
      description: Yeni parola (1.5 adım 2). Başarıda tüm oturumlar kapanır (gateway INVALID_SESSION). Bağlantı hataları `verifyEmail` ile aynı.
      parameters: []
      responses:
        '204':
          description: 204 yanıtı.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      security:
        - {}
  /v1/auth/refresh:
    post:
      operationId: Auth_refresh
      description: '`chatapp_rt` çerezini döndürür (rotasyon; eski token yeniden kullanılırsa tüm aile iptal → 401).'
      parameters:
        - name: chatapp_rt
          in: cookie
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
      security:
        - {}
  /v1/auth/register:
    post:
      operationId: Auth_register
      description: Kayıt (EKRANLAR 1.3). Geçersiz/tükenmiş beta kodu → 422 BETA_CODE_*; 18 altı → 422 UNDERAGE; kayıtlı e-posta → 409 EMAIL_TAKEN.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security:
        - {}
  /v1/auth/sessions:
    get:
      operationId: Auth_listSessions
      description: Aktif oturumlar (7.4), son kullanım yeniden eskiye.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveSession'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
  /v1/auth/sessions/revoke-others:
    post:
      operationId: Auth_revokeOtherSessions
      description: Bu oturum dışındaki tüm oturumları kapatır.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeOthersResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
  /v1/auth/sessions/{session_id}:
    delete:
      operationId: Auth_revokeSession
      description: Bir oturumu (ailesiyle) kapatır; erişim token'ı da hemen düşer. Başkasının ya da kapalı oturum → 404 NOT_FOUND.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
      responses:
        '204':
          description: 204 yanıtı.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
  /v1/auth/username-available:
    get:
      operationId: Auth_usernameAvailable
      description: Kullanıcı adı anlık müsaitlik (1.3). Hız sınırlı.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailability'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - auth
      security:
        - {}
  /v1/channels/{channel_id}:
    get:
      operationId: Channels_get
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - channels
    patch:
      operationId: Channels_update
      description: MANAGE_CHANNELS (izin alanları için ayrıca MANAGE_ROLES).
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - $ref: '#/components/parameters/AuditReasonHeader'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
    delete:
      operationId: Channels_delete
      description: MANAGE_CHANNELS. Kategori silinince alt kanallar köke iner.
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - $ref: '#/components/parameters/AuditReasonHeader'
      responses:
        '204':
          description: 204 yanıtı.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - channels
  /v1/channels/{channel_id}/invites:
    post:
      operationId: Invites_create
      description: CREATE_INSTANT_INVITE.
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - $ref: '#/components/parameters/AuditReasonHeader'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteWithMetadata'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - invites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
  /v1/channels/{channel_id}/messages:
    get:
      operationId: Messages_list
      description: |-
        Geçmiş (A-03). `before` / `after` / `around`'dan en çok biri; hiçbiri yoksa en yeniler.
        Yanıt her zaman **yeniden eskiye** sıralı. VIEW_CHANNEL + READ_MESSAGE_HISTORY.
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: before
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Snowflake'
          explode: false
        - name: after
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Snowflake'
          explode: false
        - name: around
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Snowflake'
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - messages
    post:
      operationId: Messages_create
      description: SEND_MESSAGES (G-01, A-02). DB + outbox aynı işlemde; MESSAGE_CREATE yayılır.
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
  /v1/channels/{channel_id}/messages/{message_id}:
    get:
      operationId: Messages_get
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: message_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - messages
    patch:
      operationId: Messages_update
      description: Yalnız yazar. MESSAGE_UPDATE yayılır.
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: message_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
    delete:
      operationId: Messages_delete
      description: 'Yazar ya da MANAGE_MESSAGES (moderatör silmesi denetim kaydına düşer). Yumuşak silme (K32: 30 gün saklanır).'
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: message_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - $ref: '#/components/parameters/AuditReasonHeader'
      responses:
        '204':
          description: 204 yanıtı.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - messages
  /v1/channels/{channel_id}/messages/{message_id}/ack:
    post:
      operationId: Messages_ack
      description: Okundu işaretle; `last_read_message_id = message_id`, `mention_count = 0`. MESSAGE_ACK (yalnız kendine) yayılır.
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: message_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
      responses:
        '204':
          description: 204 yanıtı.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - messages
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
  /v1/channels/{channel_id}/messages/{message_id}/reactions/{emoji}:
    get:
      operationId: Messages_listReactions
      description: Tepki verenler (kullanıcı kimliğine göre artan).
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: message_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: emoji
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Snowflake'
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 25
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - messages
  /v1/channels/{channel_id}/messages/{message_id}/reactions/{emoji}/@me:
    put:
      operationId: Messages_addReaction
      description: Tepki ekle. `emoji` = URL-encoded Unicode emoji. ADD_REACTIONS (mesajda zaten olan tepkiye katılmak için gerekmez).
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: message_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: emoji
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 204 yanıtı.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - messages
    delete:
      operationId: Messages_removeOwnReaction
      parameters:
        - name: channel_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Snowflake'
        - name: message_id
